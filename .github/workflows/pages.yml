name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
  stage-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach APK to the first release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.1.0
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true ]; then
            exit 0
          fi
          cp files/prompt-library-0.1.0.apk /tmp/prompt-library.apk
          gh release upload "$tag" /tmp/prompt-library.apk --clobber
